<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0D2137" />
    <meta
      name="description"
      content="Pazo partner platform — share your referral link and earn commission on every purchase. Referral tracking, wallets and payouts for partners across Tanzania."
    />

    <title>Pazo — Partner platform</title>

    <!-- The supplied logo, whole and uncropped, on a square tile. Browsers
         pick the size they need rather than scaling one image badly. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Link preview for WhatsApp, Twitter, LinkedIn and Slack. Partners share
         their referral link constantly, so this card is seen often. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pazo" />
    <meta property="og:title" content="Pazo — Refer. Connect. Earn." />
    <meta
      property="og:description"
      content="Share your link and earn commission every time someone connects through you. The partner programme for The Travela."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pazo — Refer. Connect. Earn." />
    <meta
      name="twitter:description"
      content="Share your link and earn commission every time someone connects through you."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Painted before React mounts so the first frame is never white. */
      html,
      body {
        margin: 0;
        background: #f0fafa;
      }
      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(150deg, #b8e8e8 0%, #d4f0f0 30%, #eaf7f7 65%, #f2fbfb 100%);
      }
      .boot-spinner {
        width: 30px;
        height: 30px;
        border: 3px solid rgba(0, 123, 132, 0.2);
        border-top-color: #007b84;
        border-radius: 50%;
        animation: boot-spin 0.7s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot"><div class="boot-spinner"></div></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
