<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0D2137" />
    <meta
      name="description"
      content="Pazo partner platform — share your referral link and earn commission on every purchase. Referral tracking, wallets and payouts for partners across Tanzania."
    />

    <title>Pazo — Partner platform</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Painted before React mounts so the first frame is never white. */
      html,
      body {
        margin: 0;
        background: #f0fafa;
      }
      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(150deg, #b8e8e8 0%, #d4f0f0 30%, #eaf7f7 65%, #f2fbfb 100%);
      }
      .boot-spinner {
        width: 30px;
        height: 30px;
        border: 3px solid rgba(0, 123, 132, 0.2);
        border-top-color: #007b84;
        border-radius: 50%;
        animation: boot-spin 0.7s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot"><div class="boot-spinner"></div></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
