<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    Pazo favicon.

    A browser tab renders this at 16px, where a four-letter wordmark becomes an
    unreadable smudge. So the tile uses the logo's "o" — the teal ring — on the
    brand navy. It is the one glyph in the mark that stays crisp at tab size,
    carries the brand colour, and reads as a deliberate icon rather than a
    shrunken logo.

    The full wordmark is used everywhere it has room: the app header, the
    landing page and the social preview.
  -->
  <rect width="100" height="100" rx="22" fill="#0D2137"/>
  <circle cx="50" cy="50" r="26" fill="none" stroke="#00A8B5" stroke-width="15"/>
</svg>
